name: MainTrack logout regression
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  logout-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      MAINTRACK_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: node --test remediation/logout/tests/logout.test.mjs ops/maintrack/tests/security-overlay.test.mjs
