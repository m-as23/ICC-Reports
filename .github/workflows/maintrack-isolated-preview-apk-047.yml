name: MainTrack 0.4.7 isolated installable Preview APK
# Approved compact cards/empty search, Owner versions and activity log.
on:
  push:
    branches: [feature/maintrack-047-integration-20261022]
    paths:
      - '.github/workflows/maintrack-isolated-preview-apk-047.yml'
  workflow_dispatch:
permissions:
  contents: read
  checks: read
concurrency:
  group: maintrack-047-isolated-preview-build
  cancel-in-progress: false
jobs:
  assemble:
    name: Build side-by-side Preview 407 with temporary QA certificate
    if: github.repository == 'm-as23/ICC-Reports' && github.ref == 'refs/heads/feature/maintrack-047-integration-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: android/maintrack-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked build dependencies
        run: npm --prefix android/maintrack-app ci --no-audit --no-fund
      - name: Test 047 source parity and APK identity guards
        run: |
          mkdir -p audit-output
          node ops/maintrack/tests/test_047_static.cjs
          node ops/maintrack/scripts/audit-release-workflows.mjs
          node --test ops/maintrack/tests/prepare-047-owner-preview.test.mjs
          python3 -m unittest discover -s ops/maintrack/tests -p test_verify_native_407_build.py -v
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          // Historical 046 source pins stay covered on immutable baseline in maintrack-change-qa.
          // Current source hashes are checked by the dedicated 047 parity test above.
          const files=fs.readdirSync('android/maintrack-app/tests').filter(p=>p.endsWith('.test.mjs')&&p!=='shared-source.test.mjs').sort().map(p=>'android/maintrack-app/tests/'+p);
          execFileSync(process.execPath,['--test',...files],{stdio:'inherit'});
          JS
      - name: Assemble matching Web and native 047 assets
        run: node ops/maintrack/scripts/prepare-047-owner-preview.mjs --prepare
      - name: Prepare Android 407 with existing Keystore session plugin
        working-directory: android/maintrack-app
        run: |
          set -euo pipefail
          cp -a ../../audit-output/owner-047/native/www ./www
          npm run android:prepare
          npm run android:icons
          npx cap sync android
          node scripts/harden-native.mjs
          python3 - <<'PYTHON'
          from pathlib import Path
          import re
          p=Path('android/app/build.gradle')
          s=p.read_text()
          assert len(re.findall(r'\bversionCode\s+\d+',s))==1
          assert len(re.findall(r'\bversionName\s+"[^"]+"',s))==1
          s=re.sub(r'\bversionCode\s+\d+','versionCode 407',s,count=1)
          s=re.sub(r'\bversionName\s+"[^"]+"','versionName "0.4.7"',s,count=1)
          assert s.count('applicationId "com.icc.maintrack"')==1
          s=s.replace('applicationId "com.icc.maintrack"','applicationId "com.icc.maintrack.preview047r5"')
          p.write_text(s)
          strings=Path('android/app/src/main/res/values/strings.xml')
          strings.write_text(strings.read_text().replace('>MainTrack<','>MainTrack 0.4.7 Preview 5<'))
          PYTHON
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          "$MANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
          python3 ../../ops/maintrack/scripts/verify-native-407-build.py --mode android-sync
      - name: Compile actual unsigned release APK
        working-directory: android/maintrack-app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Sign isolated package with ephemeral QA key (never original Owner key)
        run: |
          set -euo pipefail
          umask 077
          export MT047_QA_PASS="$(openssl rand -hex 24)"
          QA_KEY="$RUNNER_TEMP/maintrack-preview047.p12"
          trap 'rm -f "$QA_KEY"' EXIT
          keytool -genkeypair -keystore "$QA_KEY" -storetype PKCS12 -alias preview047 -storepass:env MT047_QA_PASS -keypass:env MT047_QA_PASS -keyalg RSA -keysize 3072 -validity 30 -dname 'CN=MainTrack Isolated 047 Preview' > "$RUNNER_TEMP/047-keytool.log" 2>&1
          TOOLS="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0"
          mkdir -p release-output
          "$TOOLS/zipalign" -p -f 4 android/maintrack-app/android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/047-preview-aligned.apk"
          "$TOOLS/apksigner" sign --ks "$QA_KEY" --ks-key-alias preview047 --ks-pass env:MT047_QA_PASS --key-pass env:MT047_QA_PASS --v2-signing-enabled true --v3-signing-enabled true --out release-output/MainTrack-0.4.7-407-APPROVED-DESIGN-PREVIEW.apk "$RUNNER_TEMP/047-preview-aligned.apk"
          "$TOOLS/apksigner" verify --verbose --print-certs release-output/MainTrack-0.4.7-407-APPROVED-DESIGN-PREVIEW.apk > release-output/signature-public.txt
          "$TOOLS/aapt" dump badging release-output/MainTrack-0.4.7-407-APPROVED-DESIGN-PREVIEW.apk > release-output/apk-badging.txt
          keytool -exportcert -keystore "$QA_KEY" -alias preview047 -storepass:env MT047_QA_PASS | sha256sum > "$RUNNER_TEMP/047-expected-cert.sha256"
          python3 - <<'PYTHON'
          from pathlib import Path
          import re,json,zipfile,hashlib,os
          out=Path('release-output')
          signature=(out/'signature-public.txt').read_text()
          badge=(out/'apk-badging.txt').read_text()
          identity=re.search(r"^package:\s+name='([^']+)'\s+versionCode='([^']+)'\s+versionName='([^']+)'",badge,re.M)
          assert identity and identity.groups()==('com.icc.maintrack.preview047r5','407','0.4.7'),'PREVIEW_MUST_NOT_REPLACE_ORIGINAL_APP'
          assert 'application-debuggable' not in badge
          cert=re.search(r'Signer #1 certificate SHA-256 digest:\s*([0-9a-fA-F]{64})',signature).group(1).lower()
          assert cert==Path(os.environ['RUNNER_TEMP']+'/047-expected-cert.sha256').read_text().split()[0]
          assert cert!='07a35f17c9a7a17b24b1867e839fab2043d83f998bb604701776f3f64c807d5b'
          for v in (2,3):assert re.search(r'Verified using v'+str(v)+r' scheme[^\n]*:\s*true',signature)
          apk=out/'MainTrack-0.4.7-407-APPROVED-DESIGN-PREVIEW.apk'
          reviewed=Path('audit-output/owner-047/native/www')
          with zipfile.ZipFile(apk) as z:
           for f in reviewed.rglob('*'):
            if f.is_file():assert z.read('assets/public/'+f.relative_to(reviewed).as_posix())==f.read_bytes()
          report=json.loads(Path('audit-output/owner-047/provenance.json').read_text())
          report.update({'channel':'ISOLATED_OWNER_PREVIEW_047','appId':'com.icc.maintrack.preview047r5','originalPackageUnchangedByDesign':True,'certificateSha256':cert,'temporaryQaCertificate':True,'signatureV2':True,'signatureV3':True,'apkSha256':hashlib.sha256(apk.read_bytes()).hexdigest(),'apkBytes':apk.stat().st_size,'deviceInstallTest':'NOT_RUN'})
          (out/'MainTrack-047-Isolated-Preview-Provenance.json').write_text(json.dumps(report,indent=2)+'\n')
          print('PASS separate package, release build, temporary certificate, v2/v3 and exact shared/native application assets')
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: MainTrack-047-407-ISOLATED-INVENTORY-SIGNED-PREVIEW
          path: release-output
          if-no-files-found: error
          retention-days: 7
