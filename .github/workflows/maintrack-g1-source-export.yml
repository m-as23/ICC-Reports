name: MainTrack G1 — Source and Git History Export (NO DATABASE DATA)
on:
  push:
    branches: [fix/maintrack-g1-export-20261020]
    paths:
      - .github/workflows/maintrack-g1-source-export.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maintrack-g1-source-export
  cancel-in-progress: false
jobs:
  source-snapshot:
    name: Archive read-only source, tests, and complete Git ref history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout historical sources and complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export pinned approved 0.4.6 + recent QA sources and all Git refs
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REPOSITORY" = 'm-as23/ICC-Reports'
          test "$GITHUB_REF" = 'refs/heads/fix/maintrack-g1-export-20261020'
          RELEASE='1248211b662981e3e7db27ac0a61ca4d23862ca1'
          QA='ec2e4dcdd3e862f0efcb3f716ec2948fe93e338f'
          FRONT='5906082a29f785d5f0443851ec65719db7b4a8bd'
          mkdir -p g1-source
          for sha in "$RELEASE" "$QA" "$FRONT"; do
            git cat-file -e "$sha^{commit}"
          done
          git archive --format=tar.gz --prefix=MainTrack_G1_0.4.6_APPROVED_SOURCE/ "$RELEASE" > g1-source/01_MainTrack_G1_0.4.6_Release_Source.tar.gz
          git archive --format=tar.gz --prefix=MainTrack_G1_Automation_QA/ "$QA" > g1-source/02_MainTrack_G1_Automation_QA.tar.gz
          git archive --format=tar.gz --prefix=MainTrack_G1_Frontend_Candidate/ "$FRONT" > g1-source/03_MainTrack_G1_Frontend_Candidate.tar.gz
          # Git bundle is a backup of this PUBLIC repository's existing branch/tag history, no new secrets.
          git bundle create g1-source/04_MainTrack_Git_History_All_Refs.bundle --all
          git bundle verify g1-source/04_MainTrack_Git_History_All_Refs.bundle
          git ls-files > g1-source/06_Release_Branch_File_Index.txt
          printf 'Release_0.4.6_SHA=%s\nQA_SHA=%s\nFrontend_Candidate_SHA=%s\nExport_SHA=%s\n' "$RELEASE" "$QA" "$FRONT" "$GITHUB_SHA" > g1-source/07_Version_References.txt
          printf '%s\n' 'Source only. NO database rows, authentication secrets, private keys, external Storage objects, signed native APK, or verified restore included.' > g1-source/08_SCOPE_AND_MISSING_COMPONENTS.txt
          (cd g1-source && sha256sum 0* > SHA256SUMS.txt)
          test -s g1-source/04_MainTrack_Git_History_All_Refs.bundle
          (cd g1-source && sha256sum -c SHA256SUMS.txt)
      - name: Upload complete Git source and tests archive
        uses: actions/upload-artifact@v4
        with:
          name: MainTrack_G1_Public_Source_Test_Automation_Git_History_20261020
          path: g1-source/
          retention-days: 30
          if-no-files-found: error
      - name: Scope notice
        run: |
          echo 'ARCHIVED: exact 0.4.6 source + pinned QA + UI review + full PUBLIC Git ref history.' >> "$GITHUB_STEP_SUMMARY"
          echo 'NO Supabase data read/export; NO secret access; NO deployment; NO APK signing; NO employee update.' >> "$GITHUB_STEP_SUMMARY"
