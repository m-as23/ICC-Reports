name: MainTrack — Signed Native 401-to-404 Upgrade Smoke (QA only)
on:
  push:
    branches: [ops/maintrack-044-production-foundation-20261018]
    paths:
      - '.github/workflows/maintrack-owner-qa-044-emulator.yml'
      - 'android/maintrack-app/scripts/qa/emulator-upgrade-044.sh'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  signed-owner-apk-emulator:
    if: github.ref == 'refs/heads/ops/maintrack-044-production-foundation-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android/maintrack-app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assert no employee production release authorized
        run: node ../../ops/maintrack/scripts/employee-release-gate.mjs --assert-blocked
      - uses: actions/download-artifact@v4
        with:
          name: MainTrack-0.4.4-SIGNED-OWNER-QA-NOT-FOR-EMPLOYEES
          repository: m-as23/ICC-Reports
          run-id: 39172121032
          github-token: ${{ github.token }}
          path: android/maintrack-app/.qa-044
      - uses: actions/download-artifact@v4
        with:
          name: MainTrack-Background-Updates-Signed-APK
          repository: m-as23/ICC-Reports
          run-id: 38978979438
          github-token: ${{ github.token }}
          path: android/maintrack-app/.qa-old-041
      - name: Require original signed 0.4.1 / code 401 artifact before testing upgrade
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib,pathlib
          old=pathlib.Path('.qa-old-041')
          baseline=json.loads(pathlib.Path('../../ops/maintrack/employee-release-gates.json').read_text())['currentBaseline']
          signed=json.loads((old/'release-provenance.json').read_text())
          apk=old/'MainTrack-stage14-release.apk'
          assert apk.is_file(),'ORIGINAL_SIGNED_041_APK_MISSING'
          assert signed['signed'] is True and signed['appId']==baseline['appId'],'OLD_APK_IDENTITY'
          assert signed['versionCode']==401 and signed['versionName']=='0.4.1','OLD_APK_NOT_PHONE_VERSION'
          assert signed['certificateSha256']==baseline['installedAndroidCertificateSha256'],'OLD_APK_CERT_DIFFERENT_FROM_PHONE'
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==signed['apkSha256'],'OLD_APK_HASH_FAILED'
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==(old/'MainTrack-stage14-release.sha256').read_text().split()[0],'OLD_SIGNED_HASH_FILE_FAILED'
          print('PASS archived 0.4.1 signed APK has correct certificate and exact phone version code 401')
          PY
      - name: Verify downloaded bytes, app signature and non-production designation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('.qa-044')
          proof=json.loads((p/'owner-qa-provenance.json').read_text())
          baseline=json.loads(Path('../../ops/maintrack/employee-release-gates.json').read_text())['currentBaseline']
          apk=p/'MainTrack-0.4.4-Owner-QA-ONLY.apk'
          assert apk.is_file() and hashlib.sha256(apk.read_bytes()).hexdigest()==proof['sha256'],'APK_HASH_MISMATCH'
          assert apk.stat().st_size==proof['bytes'],'APK_LENGTH_MISMATCH'
          assert proof['certificateSha256']==baseline['installedAndroidCertificateSha256'],'ANDROID_CERT_MISMATCH'
          assert proof['appId']==baseline['appId']=='com.icc.maintrack','APP_ID_MISMATCH'
          assert proof['versionCode']>baseline['installedNativeVersionCode'],'NOT_AN_UPGRADE'
          assert proof['versionCode']==404 and proof['versionName']=='0.4.4','UNEXPECTED_BUILD'
          assert proof['employeeRelease'] is False and proof['rolloutEnabled'] is False
          assert proof['channel']=='OWNER_QA_ONLY' and proof['qaApiOnly'] is True
          print('PASS exact signed QA-only APK artifact, original cert fingerprint and increasing versionCode')
          PY
      - name: Android 35 emulator — real signed 0.4.1 to 0.4.4 in-place upgrade
        uses: reactivecircus/android-emulator-runner@v2
        with:
          working-directory: android/maintrack-app
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: sh scripts/qa/emulator-upgrade-044.sh
      - name: Record scope of synthetic test, not employee approval
        if: always()
        run: |
          echo '### Owner QA 0.4.4 emulator checks' >> "$GITHUB_STEP_SUMMARY"
          echo 'No employees, Production web, Production database, OTA manifest or production rollout were modified.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This workflow only attempts signed 0.4.1 to 0.4.4 in-place upgrade; check actual step outcome. Owner session/data continuity still requires real-device acceptance.' >> "$GITHUB_STEP_SUMMARY"
