name: MainTrack 0.4.4 - Owner Android Keystore Fingerprint Check (No Release)
on:
  push:
    branches: [fix/maintrack-044-session-and-bottom-bar-only-20261018]
    paths: ['.github/workflows/maintrack-044-android-keystore-match-readonly.yml']
permissions: {}
jobs:
  compare-certificate:
    if: github.repository == 'm-as23/ICC-Reports' && github.ref == 'refs/heads/fix/maintrack-044-session-and-bottom-bar-only-20261018'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: maintrack-android-release
    steps:
      - name: Verify Android keystore locally on the runner - no checkout, artifact, upload or deployment
        env:
          MT_ANDROID_KEYSTORE_BASE64: ${{ secrets.MT_ANDROID_KEYSTORE_BASE64 }}
          MT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MT_ANDROID_KEYSTORE_PASSWORD }}
          MT_ANDROID_KEY_ALIAS: ${{ secrets.MT_ANDROID_KEY_ALIAS }}
          MT_ANDROID_KEY_PASSWORD: ${{ secrets.MT_ANDROID_KEY_PASSWORD }}
          MT_ANDROID_EXPECTED_CERT_SHA256: ${{ vars.MT_ANDROID_EXPECTED_CERT_SHA256 }}
        shell: bash
        run: |
          set +x
          umask 077
          python3 - <<'PY'
          import base64, hashlib, os, pathlib, re, shutil, subprocess, sys, tempfile

          INSTALLED = '07a35f17c9a7a17b24b1867e839fab2043d83f998bb604701776f3f64c807d5b'
          NAMES = ['MT_ANDROID_KEYSTORE_BASE64', 'MT_ANDROID_KEYSTORE_PASSWORD',
                   'MT_ANDROID_KEY_ALIAS', 'MT_ANDROID_KEY_PASSWORD']
          def report(ok, stage):
              print('MAINTRACK_OWNER_ANDROID_SIGNING_PROBE '+('PASS' if ok else 'BLOCKED')+': '+stage, flush=True)
              if not ok:
                  sys.exit(1)

          for name in NAMES:
              if not os.environ.get(name):
                  report(False, 'REQUIRED_ENVIRONMENT_SECRET_MISSING')
          expected = re.sub(r'[:\s]', '', os.environ.get('MT_ANDROID_EXPECTED_CERT_SHA256', '')).lower()
          if not re.fullmatch(r'[0-9a-f]{64}', expected) or expected != INSTALLED:
              report(False, 'PUBLIC_CERTIFICATE_FINGERPRINT_NOT_APPROVED')

          alias = os.environ['MT_ANDROID_KEY_ALIAS']
          if len(alias) > 128 or any(c in alias for c in '\r\n\0'):
              report(False, 'INVALID_SIGNING_KEY_ALIAS')
          if not shutil.which('keytool'):
              report(False, 'JAVA_KEYTOOL_NOT_AVAILABLE')

          try:
              encrypted = base64.b64decode(os.environ['MT_ANDROID_KEYSTORE_BASE64'].strip(),validate=True)
              if not (500 <= len(encrypted) <= 10_000_000):
                  report(False, 'INVALID_KEYSTORE_LENGTH')
              with tempfile.TemporaryDirectory(prefix='mt-signature-check-') as temp:
                  keyfile = pathlib.Path(temp) / 'private-keystore.p12'
                  keyfile.write_bytes(encrypted)
                  os.chmod(keyfile, 0o600)
                  cmd = ['keytool', '-list', '-v', '-keystore', str(keyfile),
                         '-storepass:env', 'MT_ANDROID_KEYSTORE_PASSWORD',
                         '-alias', alias]
                  # Deliberately keep all command output in memory. Never print aliases,
                  # certificates, passphrases, private-key material, or tool errors.
                  check = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                         timeout=25, check=False)
                  if check.returncode or b'PrivateKeyEntry' not in check.stdout:
                      report(False, 'PRIVATE_KEY_ENTRY_CANNOT_BE_OPENED')
                  exported = subprocess.run(
                      ['keytool', '-exportcert', '-keystore', str(keyfile),
                       '-storepass:env', 'MT_ANDROID_KEYSTORE_PASSWORD', '-alias', alias],
                      stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=25, check=False)
                  if exported.returncode or not exported.stdout:
                      report(False, 'PUBLIC_CERTIFICATE_CANNOT_BE_EXPORTED')
                  actual = hashlib.sha256(exported.stdout).hexdigest()
                  if actual != INSTALLED:
                      report(False, 'KEYSTORE_CERTIFICATE_DOES_NOT_MATCH_INSTALLED_APK')
                  csr = pathlib.Path(temp) / 'test-proof.csr'
                  proof = subprocess.run(
                      ['keytool', '-certreq', '-keystore', str(keyfile),
                       '-storepass:env', 'MT_ANDROID_KEYSTORE_PASSWORD',
                       '-keypass:env', 'MT_ANDROID_KEY_PASSWORD',
                       '-alias', alias, '-file', str(csr)],
                      stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=25, check=False)
                  if proof.returncode or not csr.exists() or csr.stat().st_size < 100:
                      report(False, 'PRIVATE_KEY_SIGNING_PROOF_FAILED')
                  csr.unlink()
              report(True, 'INSTALLED_CERT_MATCH_AND_PRIVATE_KEY_USABLE_NO_APK_BUILT')
          except (ValueError, OSError, subprocess.TimeoutExpired, subprocess.SubprocessError):
              report(False, 'KEYSTORE_VERIFICATION_FAILED_WITHOUT_SECRET_OUTPUT')
          PY
