name: MainTrack — One-Time Environment Branch Restriction Test
on:
  push:
    branches:
      - fix/maintrack-ruleset-qa-proof-20261019
    paths:
      - .github/workflows/maintrack-security-env-denial-test-20261019.yml
permissions:
  contents: read
jobs:
  verify-legacy-branch-cannot-use-release-environment:
    name: GitHub must reject an unapproved branch BEFORE executing anything
    runs-on: ubuntu-latest
    environment: maintrack-android-release
    timeout-minutes: 3
    steps:
      - name: SECURITY FAILURE — This step must never run
        run: |
          echo "FAIL_OPEN: unapproved branch was allowed to enter signing environment" >&2
          exit 93
