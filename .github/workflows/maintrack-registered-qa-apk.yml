name: MainTrack registered QA unsigned APK
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: registered-qa-apk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qa-apk:
    if: github.ref == 'refs/heads/security/maintrack-security-integration-20261028' && github.actor == 'm-as23'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.2'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify and prepare exact QA inputs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p audit-output
          python3 -m unittest discover -s ops/maintrack/tests -p test_ci_qa_inputs.py
          python3 ops/maintrack/scripts/prepare-ci-qa-android.py --output audit-output/registered-ci-qa
          npm --prefix android/maintrack-app ci --no-audit --no-fund
      - name: Compile QA unsigned APK without signing credentials
        run: |
          set -euo pipefail
          MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          "$MANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
          (cd audit-output/registered-ci-qa && ./gradlew --no-daemon --max-workers=2 assembleRelease)
          mkdir -p audit-output/registered-ci-artifact
          cp audit-output/registered-ci-qa/app/build/outputs/apk/release/app-release-unsigned.apk audit-output/registered-ci-artifact/MainTrack-Registered-QA-UNSIGNED.apk
      - name: Bind actual APK to source and runner identity
        run: |
          python3 - <<'PY'
          import pathlib,sys,os,json,hashlib,zipfile
          sys.path.insert(0,'security-regression')
          from signing_chain import payload
          out=pathlib.Path('audit-output/registered-ci-artifact')
          apk=out/'MainTrack-Registered-QA-UNSIGNED.apk'
          payload(apk,unsigned=True)
          inputs=json.loads(pathlib.Path('ops/maintrack/security/qa-native-build-inputs/manifest.json').read_text())
          with zipfile.ZipFile(apk) as z:
              for x in inputs['files']:
                  if x['path'].startswith('app/src/main/assets/'):
                      name=x['path'].removeprefix('app/src/main/')
                      assert hashlib.sha256(z.read(name)).hexdigest()==x['sha256'],name
          record={'sourceCommit':os.environ['GITHUB_SHA'],'runId':int(os.environ['GITHUB_RUN_ID']),'attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'workflowPath':'.github/workflows/maintrack-registered-qa-apk.yml','apkSha256':hashlib.sha256(apk.read_bytes()).hexdigest(),'sourceArchiveSha256':inputs['archiveSha256'],'package':'com.icc.maintrack.qa','signing':'UNSIGNED','certificate':None,'signingAuthorized':False,'deploymentAuthorized':False,'physicalAcceptance':'DEFERRED_BY_OWNER'}
          (out/'build-provenance.json').write_text(json.dumps(record,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maintrack-registered-qa-unsigned-${{ github.sha }}
          path: audit-output/registered-ci-artifact/
          retention-days: 7
          if-no-files-found: error
