name: MainTrack 0.4.4 — Full Baseline Source and OTA Backup
on:
  push:
    branches: [release/maintrack-stage22-044-integration]
    paths: ['.github/workflows/maintrack-stage22-backup-bundle.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  export:
    if: github.ref == 'refs/heads/release/maintrack-stage22-044-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lock existing accepted source and download signed LAB 0.4.4
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code 865229c4706e946377fba811d2f51dad1a815138 "$GITHUB_SHA" -- web/maintrack/public android/maintrack-app/update-system android/maintrack-app/release/owner-public.json
          git fetch --no-tags origin android/stage14-ota-native-lab
          mkdir -p export/Android-OTA-signed export/Web-Candidate-REVIEW-ONLY export/Database export/Full-Source
          git show FETCH_HEAD:updates/android/release.json > export/Android-OTA-signed/release.json
          git show FETCH_HEAD:updates/android/maintrack-0.4.4.zip > export/Android-OTA-signed/maintrack-0.4.4.zip
          cp release/stage22/database-schema-catalog-2026-10-18.json export/Database/
          cp -a db/applied export/Database/source-SQL
      - name: Validate existing trusted owner OTA 0.4.4
        run: |
          set -euo pipefail
          npm --prefix android/maintrack-app ci --no-audit --no-fund
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {canonicalJson} from './android/maintrack-app/update-system/policy.mjs';
          const m=JSON.parse(fs.readFileSync('export/Android-OTA-signed/release.json','utf8'));
          const c=JSON.parse(fs.readFileSync('android/maintrack-app/release/owner-public.json','utf8'));
          const p=m.payload;
          if(p.bundleVersion!=='0.4.4'||p.channel!=='lab'||p.appId!=='com.icc.maintrack')throw Error('WRONG_OTA');
          if(p.sha256!=='86c514750b2a30950c1882f2d8a350cff62c41bcb241d43085ef2c5085456843')throw Error('WRONG_OTA_HASH');
          if(JSON.stringify(p.localData)!==JSON.stringify({reportQueue:1,writesReportQueue:1,migration:'none'}))throw Error('LOCAL_DATA_CONTRACT_CHANGED');
          const key=crypto.createPublicKey({key:Buffer.concat([Buffer.from('302a300506032b6570032100','hex'),Buffer.from(c.publicKeyBase64,'base64url')]),format:'der',type:'spki'});
          if(!crypto.verify(null,Buffer.from(canonicalJson(p)),key,Buffer.from(m.signature,'base64url')))throw Error('SIGNATURE_BAD');
          const file=fs.readFileSync('export/Android-OTA-signed/maintrack-0.4.4.zip');
          if(file.length!==p.bytes||crypto.createHash('sha256').update(file).digest('hex')!==p.sha256)throw Error('OTA_BYTES_BAD');
          console.log('PASS OWNER_044_SIGNED_OTA_VERIFIED');
          NODE
      - name: Retrieve reviewed Stage22 Web candidate
        uses: actions/download-artifact@v4
        with:
          name: MainTrack-Stage22-044-Unpublished-Release-Candidate
          repository: m-as23/ICC-Reports
          run-id: 39127423740
          github-token: ${{ github.token }}
          path: candidate
      - name: Assemble complete source and documented delivery
        run: |
          set -euo pipefail
          cp candidate/unified-four-review/MainTrack-Web-REVIEW-ONLY.zip export/Web-Candidate-REVIEW-ONLY/
          cp candidate/unified-four-review/candidate.json export/Web-Candidate-REVIEW-ONLY/
          git archive --format=zip --prefix=MainTrack-0.4.4-source/ HEAD > export/Full-Source/MainTrack-0.4.4-FULL-SOURCE.zip
          python3 - <<'PY'
          import pathlib,json,zipfile,hashlib,os
          r=pathlib.Path('export')
          src=r/'Full-Source/MainTrack-0.4.4-FULL-SOURCE.zip'
          with zipfile.ZipFile(src) as z:
            names=set(z.namelist())
            must=['web/maintrack/public/index.html','supabase/functions/maintrack-stage9-security-api/index.ts',
                  'android/maintrack-app/package.json','db/applied/maintrack-unified-four-staging.sql',
                  'release/stage22/database-schema-catalog-2026-10-18.json']
            assert all('MainTrack-0.4.4-source/'+n in names for n in must), 'INCOMPLETE_SOURCE'
            assert not any(n.lower().endswith(('.keystore','.jks','.p12','.pem','.env','.env.local')) or '/.env.' in n.lower() for n in names), 'PRIVATE_KEY_FILE_IN_SOURCE'
          record={'product':'MainTrack','version':'0.4.4','kind':'source+lab_ota+web_review',
                  'candidateCommit':'865229c4706e946377fba811d2f51dad1a815138',
                  'snapshotCommit':os.environ['GITHUB_SHA'],
                  'android':'signed OTA ZIP for existing app, NOT a standalone installable APK',
                  'web':'review-only static candidate, NOT live production host',
                  'database':'schema catalog + tracked SQL scripts; no user records and NOT a restorable production backup',
                  'signedNativeAPKIncluded':False,'secretsIncluded':False,'publicProductionApproved':False}
          (r/'PACKAGE_MANIFEST.json').write_text(json.dumps(record,indent=2)+'\n')
          (r/'README_AR.txt').write_text(
          'MainTrack 0.4.4 - أرشيف النسخة المرجعية\n'
          'Full-Source: كامل الكود المتتبع في GitHub: الويب والأندرويد والـ Backend والاختبارات وملفات SQL.\n'
          'Android-OTA-signed: حزمة التحديث الموقعة 0.4.4 وقائمة الإصدار لقناة LAB. هي ZIP للتحديث داخل APK المثبت وليست APK للتثبيت.\n'
          'Web-Candidate-REVIEW-ONLY: حزمة واجهة للمراجعة؛ غير صالحة للنشر المباشر في Production دون تفعيل مراجع الإصدارات والـAPI.\n'
          'Database: مخطط الجداول والـ SQL المصدرية دون سجلات الأشخاص، ومش Backup فعلي.\n'
          'لا يحتوي الأرشيف على ملفات أسرار أو مفاتيح التوقيع الخاصة. يتطلب نشر عام نسخة Android native موقعة إن احتجنا تحديث أصلي، وتحقيق الاختبارات الأمنية وتثبيت دومين رسمي.\n',encoding='utf8')
          sums={str(p.relative_to(r)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(r.rglob('*')) if p.is_file()}
          (r/'SHA256SUMS.json').write_text(json.dumps(sums,indent=2)+'\n')
          print('PASS SOURCE_ARCHIVE',len(names),'files', 'checksum entries',len(sums))
          PY
          cd export
          zip -q -r -9 ../MainTrack-0.4.4-Complete-Source-and-Signed-OTA.zip .
          cd ..
          unzip -t MainTrack-0.4.4-Complete-Source-and-Signed-OTA.zip | tail -1
          sha256sum MainTrack-0.4.4-Complete-Source-and-Signed-OTA.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MainTrack-0.4.4-Complete-Source-and-Signed-OTA
          path: MainTrack-0.4.4-Complete-Source-and-Signed-OTA.zip
          if-no-files-found: error
          retention-days: 30
