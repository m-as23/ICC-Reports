name: MainTrack security local
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maintrack-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  security-local:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Run bounded local security checks
        run: python security-regression/run.py --mode local --output security-regression/reports/ci.json
      - name: Retain the single run report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maintrack-security-report
          path: security-regression/reports/ci.json
          retention-days: 14
