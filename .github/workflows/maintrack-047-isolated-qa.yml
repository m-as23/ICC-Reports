name: MainTrack 0.4.7 — isolated QA, no deployment
on:
  push:
    branches:
      - feature/maintrack-047-integration-20261022
      - feature/maintrack-team-balances-from-047-20261024
      - fix/maintrack-047-inventory-cache-numerals-20261024
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maintrack-047-static-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qa-047-static:
    name: v0.4.7 — syntax, leave overlap, roles, mail duration, immutable legacy root
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protect v0.4.6 legacy root unchanged
        run: git diff --exit-code 1248211b662981e3e7db27ac0a61ca4d23862ca1 HEAD -- index.html
      - name: Validate syntax and focused regression without secrets or network
        run: |
          node --check web/maintrack/public/secure-assets/index-inline-1.js
          node --check ops/maintrack/tests/test_047_static.cjs
          node ops/maintrack/tests/test_047_static.cjs
          node --test ops/maintrack/inventory/frontend/inventory-loader.test.mjs ops/maintrack/inventory/frontend/inventory-cache.test.mjs ops/maintrack/tests/test_047_worker_equivalence.test.mjs ops/maintrack/tests/test_047_hybrid_search.test.mjs ops/maintrack/tests/test_047_approved_inventory.test.mjs ops/maintrack/tests/test_047_mail_payload.test.cjs ops/maintrack/inventory/frontend/inventory-client.test.mjs ops/maintrack/inventory/frontend/inventory-presentation.test.mjs
      - name: Test read-only Team Ledger on disposable PostgreSQL WASM
        run: |
          npm ci --prefix android/maintrack-app --no-audit --no-fund
          npm install --prefix audit-output/team-ledger-test-runtime @electric-sql/pglite@0.3.14 --ignore-scripts --no-audit --no-fund
          LEDGER_PG_PACKAGE="$GITHUB_WORKSPACE/audit-output/team-ledger-test-runtime/package.json" node --test ops/maintrack/team-ledger/test/ledger.test.mjs ops/maintrack/team-ledger/test/api.test.mjs ops/maintrack/team-ledger/test/regression.test.mjs ops/maintrack/team-ledger/test/workflow.test.mjs ops/maintrack/team-ledger/test/origin-candidate.test.mjs
      - name: Install locked XLSX dependencies (no install scripts; isolated runner only)
        run: npm ci --prefix ops/maintrack/inventory/backend --ignore-scripts --no-audit --no-fund
      - name: Verify Inventory API bearer auth, CORS, owner RBAC, invalid-session rejection (synthetic only)
        run: |
          node --test ops/maintrack/inventory/backend/test/semantic-search.test.mjs ops/maintrack/inventory/backend/test/search-assist.test.mjs ops/maintrack/inventory/backend/test/domain.test.mjs ops/maintrack/inventory/backend/test/http-adapter.test.mjs ops/maintrack/inventory/backend/test/session-adapter.test.mjs ops/maintrack/inventory/backend/test/review-http-handler.test.mjs ops/maintrack/inventory/backend/test/search-normalizer.test.mjs ops/maintrack/inventory/backend/test/postgres-search.test.mjs ops/maintrack/inventory/backend/test/search-load.synthetic.test.mjs ops/maintrack/inventory/backend/test/inventory-service.test.mjs ops/maintrack/inventory/backend/test/owner-review-pagination.test.mjs
      - name: Verify actual synthetic XLSX parser, private bucket and Owner import review flow
        run: |
          node --test ops/maintrack/inventory/backend/test/import-xlsx.test.mjs ops/maintrack/inventory/backend/test/private-bucket.test.mjs ops/maintrack/inventory/backend/test/import-service.test.mjs
      - name: Attest reviewed 0.4.7 source without modifying legacy release pins
        run: |
          node --check ops/maintrack/scripts/attest-047-source.mjs
          node ops/maintrack/scripts/attest-047-source.mjs
      - name: Save audit source fingerprints (review-only)
        uses: actions/upload-artifact@v4
        with:
          name: MainTrack-047-Source-Attestation
          path: audit-output/maintrack-047-source-attestation.json
          retention-days: 5
      - name: Record QA-only result
        run: echo 'v0.4.7 static checks only — NO DEPLOY, NO MAIL, NO DATABASE WRITE, NO APK SIGNING.' >> "$GITHUB_STEP_SUMMARY"

  qa-047-mobile:
    name: v0.4.7 — mobile Chromium form collision QA (offline backend)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: android/maintrack-app/tests-browser/package-lock.json
      - name: Install locked browser dependencies
        run: npm --prefix android/maintrack-app/tests-browser ci --no-audit --no-fund
      - name: Install Chromium
        run: npx --prefix android/maintrack-app/tests-browser playwright install --with-deps chromium
      - name: Prepare synthetic full-host ledger review without live services
        run: |
          npm install --prefix audit-output/team-ledger-test-runtime @electric-sql/pglite@0.3.14 --ignore-scripts --no-audit --no-fund
          LEDGER_PG_PACKAGE="$GITHUB_WORKSPACE/audit-output/team-ledger-test-runtime/package.json" node ops/maintrack/team-ledger/scripts/prepare-review.mjs audit-output/team-ledger-static-review
      - name: Verify four mobile viewport clearances without live API or login
        run: node --test ops/maintrack/tests/test_047_mobile.browser.mjs ops/maintrack/tests/test_047_inventory.browser.mjs ops/maintrack/tests/test_047_menu_roles.browser.mjs ops/maintrack/tests/test_047_inventory_live_ui.browser.mjs ops/maintrack/tests/test_047_inventory_loading.browser.mjs ops/maintrack/team-ledger/test/ui.browser.mjs ops/maintrack/team-ledger/test/full-app.browser.mjs
      - name: Save mobile QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MainTrack-047-MT02-Mobile-Screenshots
          path: |
            audit-output/maintrack-047-mobile/*.png
            audit-output/team-ledger-screenshots/*.png
          if-no-files-found: warn
          retention-days: 5

  qa-047-inventory-sql:
    name: v0.4.7 — pinned inventory SQL contract on disposable Postgres only
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: qa_owner
          POSTGRES_PASSWORD: disposable_only_047
          POSTGRES_DB: inventory_047_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qa_owner -d inventory_047_disposable"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: qa_owner
      PGPASSWORD: disposable_only_047
      PGDATABASE: inventory_047_disposable
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install PostgreSQL client to talk only to disposable CI service
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Apply reviewed private inventory schema on synthetic database
        run: psql -X -v ON_ERROR_STOP=1 -f ops/maintrack/inventory/001_inventory_core.review.sql
      - name: Confirm migration is idempotent
        run: psql -X -v ON_ERROR_STOP=1 -f ops/maintrack/inventory/001_inventory_core.review.sql
      - name: Apply additive Owner version management twice
        run: |
          psql -X -v ON_ERROR_STOP=1 -f ops/maintrack/inventory/002_owner_versions.sql
          psql -X -v ON_ERROR_STOP=1 -f ops/maintrack/inventory/002_owner_versions.sql
      - name: Apply private semantic index twice
        run: |
          psql -X -v ON_ERROR_STOP=1 -f ops/maintrack/inventory/003_semantic_index.sql
          psql -X -v ON_ERROR_STOP=1 -f ops/maintrack/inventory/003_semantic_index.sql
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test real versioned pgvector adapter on disposable PostgreSQL
        run: |
          npm ci --prefix ops/maintrack/inventory/backend --ignore-scripts --no-audit --no-fund
          SEMANTIC_DB_TEST=1 node --test ops/maintrack/inventory/backend/test/semantic-postgres.integration.mjs
      - name: Verify V1→V2→V3 compare, archive, stale denial and restore
        run: psql -X -v ON_ERROR_STOP=1 -f ops/maintrack/inventory/test_inventory_disposable.sql
      - name: Validate MainTrack opaque sessions against disposable PostgreSQL (no employee data)
        run: psql -X -v ON_ERROR_STOP=1 -f ops/maintrack/inventory/test_sessions_disposable.sql
      - name: Check synthetic test rolls back and inventory schema stays unexposed
        run: |
          psql -X -v ON_ERROR_STOP=1 -c "SELECT CASE WHEN (SELECT count(*) FROM inv_lab.versions)=0 AND (SELECT count(*) FROM inv_lab.audit)=0 AND (SELECT count(*) FROM inv_lab.active)=1 THEN 'PASS_ROLLBACK' ELSE 'FAIL' END"
          psql -X -v ON_ERROR_STOP=1 -c "SELECT CASE WHEN EXISTS(SELECT 1 FROM pg_namespace n CROSS JOIN LATERAL aclexplode(coalesce(n.nspacl,acldefault('n',n.nspowner))) a WHERE n.nspname='inv_lab' AND a.grantee=0 AND a.privilege_type='USAGE') THEN 'FAIL_PUBLIC_PRIVILEGE' ELSE 'PASS_PRIVATE_SCHEMA' END"
      - name: Deny simulated browser role access to private inventory schema and publish function
        run: |
          psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE mt047_untrusted_web NOLOGIN"
          if psql -X -v ON_ERROR_STOP=1 -c "SET ROLE mt047_untrusted_web; SELECT count(*) FROM inv_lab.items"; then
            echo "::error::Private inventory rows are accessible to untrusted web clients"
            exit 1
          fi
          if psql -X -v ON_ERROR_STOP=1 -c "SET ROLE mt047_untrusted_web; SELECT inv_lab.publish_version(NULL,NULL,'forged-owner')"; then
            echo "::error::Inventory publication callable from untrusted web role"
            exit 1
          fi
          echo "PASS: simulated client has no direct inventory SQL read or publish privileges"
      - name: Verify actual pg_dump and pg_restore into a fresh disposable database
        env:
          MT047_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: bash ops/maintrack/inventory/test_dump_restore_disposable.sh
      - name: Confirm no cloud resources modified
        run: echo 'PASS disposable PostgreSQL CI only; no Supabase changes, no migrations deployed.' >> "$GITHUB_STEP_SUMMARY"


  cache-numerals-browser:
    name: Actual candidate Chromium — cache, account isolation, numerals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test dependencies
        run: |
          npm ci --prefix android/maintrack-app/tests-browser --ignore-scripts --no-audit --no-fund
          npx --prefix android/maintrack-app/tests-browser playwright install --with-deps chromium
      - name: Exercise real candidate with synthetic closed transport
        run: node --test --test-concurrency=1 ops/maintrack/tests/test_047_inventory_cache.browser.mjs ops/maintrack/tests/test_047_inventory_loading.browser.mjs ops/maintrack/team-ledger/test/ui.browser.mjs
