name: MainTrack Stage14 Reviewable Release Candidates
on:
  push:
    branches: [android/stage14-ota-native-lab]
    paths:
      - '.github/workflows/maintrack-stage14-candidate.yml'
      - 'android/maintrack-app/scripts/release-candidate.py'
      - 'android/maintrack-app/scripts/release-preflight.py'
      - 'android/maintrack-app/scripts/prepare-web-preview.py'
      - 'android/maintrack-app/tests-release/**'
      - 'android/maintrack-app/scripts/snapshot.mjs'
      - 'android/maintrack-app/update-system/**'
      - 'web/maintrack/**'
  workflow_dispatch:
    inputs:
      sign_apk:
        type: boolean
        description: 'Build a signed APK only after owner-managed signing prerequisites are configured'
        default: false
      version_code:
        type: number
        description: 'Must exceed the approved last installed versionCode'
        default: 14
      version_name:
        type: string
        default: '0.3.0'
permissions:
  contents: read
jobs:
  package-review-candidates:
    if: github.ref == 'refs/heads/android/stage14-ota-native-lab'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: android/maintrack-app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require the event commit, not a moving branch
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: android/maintrack-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify release preparation without Android builds
        run: python3 -m unittest discover -s tests-release -v
      - name: Verify locked source and package unsigned candidates
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm test
          python3 scripts/release-candidate.py build
          python3 scripts/release-candidate.py verify
          python3 scripts/prepare-web-preview.py --expected-commit "$GITHUB_SHA"
          sha256sum web-preview/maintrack-web-preview.zip > web-preview/maintrack-web-preview.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: MainTrack-Stage14-Review-Candidates
          path: |
            android/maintrack-app/release-candidate/
            android/maintrack-app/web-preview/maintrack-web-preview.zip
            android/maintrack-app/web-preview/maintrack-web-preview.sha256
          if-no-files-found: error
          retention-days: 14
  signed-release:
    needs: package-review-candidates
    if: ${{ github.ref == 'refs/heads/android/stage14-ota-native-lab' && github.event_name == 'workflow_dispatch' && inputs.sign_apk && vars.MT_STAGE14_SIGNING_READY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: maintrack-android-release
    defaults:
      run:
        working-directory: android/maintrack-app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: android/maintrack-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify owner signing inputs before installing SDK or building Android
        env:
          MT_STAGE14_SIGNING_READY: ${{ vars.MT_STAGE14_SIGNING_READY }}
          EXPECTED_CERT_SHA256: ${{ vars.MT_ANDROID_EXPECTED_CERT_SHA256 }}
          LAST_VERSION_CODE: ${{ vars.MT_ANDROID_LAST_VERSION_CODE }}
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
          MT_ANDROID_KEYSTORE_BASE64: ${{ secrets.MT_ANDROID_KEYSTORE_BASE64 }}
          MT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MT_ANDROID_KEYSTORE_PASSWORD }}
          MT_ANDROID_KEY_ALIAS: ${{ secrets.MT_ANDROID_KEY_ALIAS }}
          MT_ANDROID_KEY_PASSWORD: ${{ secrets.MT_ANDROID_KEY_PASSWORD }}
        run: python3 scripts/release-preflight.py
      - name: SDK 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -x "$MANAGER"
          "$MANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Exact pinned dependencies and source
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm test
          npm run build:web
      - name: Native Release build with controlled version
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
          LAST_VERSION_CODE: ${{ vars.MT_ANDROID_LAST_VERSION_CODE }}
        run: |
          npm run android:prepare
          npm run android:icons
          npx cap sync android
          node scripts/harden-native.mjs
          node - <<'NODE'
          const fs=require('fs');
          const path='android/app/build.gradle';
          let src=fs.readFileSync(path,'utf8');
          const ver=process.env.VERSION_NAME,code=Number(process.env.VERSION_CODE);
          const last=Number(process.env.LAST_VERSION_CODE);
          if(!process.env.LAST_VERSION_CODE||!Number.isSafeInteger(last)||last<0||code<=last)throw Error('Version code must exceed approved installed version');
          if(!Number.isSafeInteger(code)||code<1||code>2000000000||!/^\d+\.\d+\.\d+(?:-[a-zA-Z0-9.-]+)?$/.test(ver))throw Error('Invalid release version');
          if(!/versionCode\s+\d+/.test(src)||!/versionName\s+"[^"]+"/.test(src))throw Error('Unexpected Gradle version');
          src=src.replace(/versionCode\s+\d+/,'versionCode '+code).replace(/versionName\s+"[^"]+"/,'versionName "'+ver+'"');
          fs.writeFileSync(path,src);
          NODE
          chmod +x android/gradlew
          (cd android && ./gradlew --no-daemon assembleRelease)
      - name: Sign and verify Release APK
        env:
          EXPECTED_CERT_SHA256: ${{ vars.MT_ANDROID_EXPECTED_CERT_SHA256 }}
          MT_ANDROID_KEYSTORE_BASE64: ${{ secrets.MT_ANDROID_KEYSTORE_BASE64 }}
          MT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MT_ANDROID_KEYSTORE_PASSWORD }}
          MT_ANDROID_KEY_ALIAS: ${{ secrets.MT_ANDROID_KEY_ALIAS }}
          MT_ANDROID_KEY_PASSWORD: ${{ secrets.MT_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f release.keystore' EXIT
          printf '%s' "$MT_ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0"
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$UNSIGNED"
          mkdir -p release-output
          "$SDK_ROOT/zipalign" -p -f 4 "$UNSIGNED" release-output/maintrack-aligned.apk
          "$SDK_ROOT/apksigner" sign --ks release.keystore --ks-key-alias "$MT_ANDROID_KEY_ALIAS" --ks-pass env:MT_ANDROID_KEYSTORE_PASSWORD --key-pass env:MT_ANDROID_KEY_PASSWORD --out release-output/MainTrack-stage14-release.apk release-output/maintrack-aligned.apk
          "$SDK_ROOT/apksigner" verify --verbose --print-certs release-output/MainTrack-stage14-release.apk > release-output/signature.txt
          python3 - <<'PYVERIFY'
          import os,re,pathlib
          expected=os.environ['EXPECTED_CERT_SHA256'].replace(':','').lower()
          assert re.fullmatch('[0-9a-f]{64}',expected), 'Owner-approved certificate fingerprint required'
          actual=re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-fA-F]+)',pathlib.Path('release-output/signature.txt').read_text())
          assert actual and actual[1].lower()==expected, 'Signing certificate mismatch'
          PYVERIFY
          "$SDK_ROOT/aapt" dump badging release-output/MainTrack-stage14-release.apk > release-output/apk-identity.txt
          python3 - <<'PYIDENTITY'
          import hashlib,json,pathlib,re
          root=pathlib.Path('release-output')
          expected=json.loads((root/'signing-preflight.json').read_text())
          identity=re.search(r"^package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'",(root/'apk-identity.txt').read_text(),re.M)
          assert identity, 'APK identity not readable'
          assert identity.groups()==(expected['appId'],str(expected['versionCode']),expected['versionName']), 'APK identity/version mismatch'
          expected['apkSha256']=hashlib.sha256((root/'MainTrack-stage14-release.apk').read_bytes()).hexdigest()
          expected['signed']=True
          (root/'release-provenance.json').write_text(json.dumps(expected,indent=2)+'\n')
          PYIDENTITY
          sha256sum release-output/MainTrack-stage14-release.apk > release-output/MainTrack-stage14-release.sha256
          rm -f release-output/maintrack-aligned.apk
      - name: Export verified signed Android release
        uses: actions/upload-artifact@v4
        with:
          name: MainTrack-Stage14-Signed-APK
          path: |
            android/maintrack-app/release-output/MainTrack-stage14-release.apk
            android/maintrack-app/release-output/MainTrack-stage14-release.sha256
            android/maintrack-app/release-output/release-provenance.json
          if-no-files-found: error
          retention-days: 14
